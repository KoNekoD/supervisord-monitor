[supervisord]
logfile=syslog
nodaemon=true
loglevel=trace
pidfile = /tmp/supervisord.pid

[program:php-fpm]
command = /usr/local/sbin/php-fpm -F
autostart=true
autorestart=true
priority=10
stopsignal=QUIT

[program:nginx]
command=/usr/sbin/nginx -e stderr -g "daemon off;"
autostart=true
autorestart=true
priority=20
stopsignal=QUIT

[program:vite]
command=npm run dev
directory=/var/www/supervisord-monitor/assets
autostart=true
autorestart=true
priority=20
stopsignal=QUIT

[program:collect-supervisord-servers-data]
command=php bin/console app:collect-supervisord-servers-data
autostart=true
startsecs=0
startretries=0
autorestart=false
priority=30
stopsignal=QUIT

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[inet_http_server]
port=*:9551
username=default
password=default
